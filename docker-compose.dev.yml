# Local dev infrastructure (§20). Postgres now comes from the self-hosted
# Supabase stack in infra/supabase (its supabase/postgres image ships PostGIS
# and the auth schema RLS depends on) — start it with:
#   cd infra/supabase && docker compose up -d
# This compose covers only what Supabase doesn't provide: Redis for BullMQ.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
