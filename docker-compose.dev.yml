# Local dev infrastructure (§20). Auth/Realtime/Storage come from the
# self-hosted Supabase stack (separate deployment) — point SUPABASE_URL at it.
# This compose covers only what the backend needs directly: Postgres+PostGIS
# and Redis.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: justgo
      POSTGRES_PASSWORD: justgo
      POSTGRES_DB: justgo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U justgo']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
